name: Zenbu 2
description: >-
  Zenbu is a Y Combinator (Spring 2026) developer-tools startup building a fully
  hackable desktop interface for managing AI coding agents. The macOS app is a
  customizable client for the "Pi" coding agent, letting developers run multiple
  agents in parallel across Git worktrees, review changes, and extend the app at
  runtime through plugins. Zenbu is built on Zenbu.js, the company's open-source
  TypeScript framework for building extensible ("hackable") applications, which
  handles plugin loading, cross-process state sync, RPC, and hot reloading. The
  framework and its scaffolding tooling are published to npm under the zenbu-labs
  organization. Zenbu does not currently expose a hosted HTTP/REST developer API;
  its developer surface is the client-side Zenbu.js framework, its plugin model,
  and its command-line scaffolders. Founded by Rob Pruzan (ex-Vercel Next.js core,
  co-author of React Scan).
